services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankadmin
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankadmin -d bankdb"]
      interval: 5s
      retries: 5

  app:
    build: .
    command: python -u -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app